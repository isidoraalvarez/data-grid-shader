<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA_GRID // Video Shader Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black selection:bg-blue-600 selection:text-white">

    <!-- Panel Lateral Brutalista -->
    <div id="ui-panel" class="absolute top-0 left-0 w-[360px] h-full bg-black/95 border-r border-neutral-800 p-8 flex flex-col gap-8 overflow-y-auto z-10 text-white shadow-2xl">
        
        <!-- Header -->
        <div class="border-b border-neutral-800 pb-6">
            <h1 class="font-pixel text-4xl uppercase tracking-widest leading-tight text-white mb-1">DATA<br>GRID</h1>
            <p class="text-blue-500 text-[10px] uppercase tracking-widest font-bold">V.2.5 // Spatial Distortion</p>
        </div>
        
        <!-- Controles Principales -->
        <div class="flex flex-col gap-6">
            
            <!-- Upload -->
            <div class="flex flex-col gap-2">
                <label class="text-[10px] text-neutral-500 uppercase tracking-widest flex justify-between">
                    <span>Input Source</span>
                    <span class="text-blue-500">[FILE]</span>
                </label>
                <label for="videoUpload" class="border border-neutral-800 hover:border-blue-500 transition-colors p-3 text-xs text-center cursor-pointer bg-neutral-950 text-white uppercase tracking-wider">
                    Browse Video
                </label>
                <input type="file" id="videoUpload" accept="video/*" class="hidden">
            </div>

            <div class="w-full border-t border-dashed border-neutral-800"></div>

            <!-- Estilo y Renderizado -->
            <div class="flex flex-col gap-5">
                
                <!-- Modo de Efecto -->
                <div class="flex flex-col gap-2">
                    <label for="effectSelect" class="text-[10px] text-neutral-500 uppercase tracking-widest">Render Mode</label>
                    <select id="effectSelect" class="bg-black border border-neutral-800 text-xs p-2.5 outline-none focus:border-blue-500 transition-colors uppercase tracking-wider text-white cursor-pointer">
                        <option value="points">01. Point Cloud</option>
                        <option value="numbers">02. Matrix Code (0136)</option>
                        <option value="wireframe">03. Grid Distortion (Mesh)</option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="depthRange" class="text-[10px] text-neutral-500 uppercase tracking-widest flex justify-between">
                        <span>Z-Depth / Distortion</span>
                    </label>
                    <input type="range" id="depthRange" min="10" max="250" value="100" class="mt-1">
                </div>

                <div class="flex gap-4 w-full">
                    <div class="flex flex-col gap-2 w-1/2">
                        <label for="colorTop" class="text-[10px] text-neutral-500 uppercase tracking-widest">Accent Color</label>
                        <input type="color" id="colorTop" value="#0055ff">
                    </div>
                    <div class="flex flex-col gap-2 w-1/2">
                        <label for="colorBottom" class="text-[10px] text-neutral-500 uppercase tracking-widest">Base Color</label>
                        <input type="color" id="colorBottom" value="#ffffff">
                    </div>
                </div>
            </div>

            <!-- Botones de Acción 3D -->
            <div class="flex flex-col gap-2 mt-2">
                <button id="btnToggleDepth" class="w-full border border-neutral-800 py-3 px-4 flex justify-between items-center hover:bg-white hover:text-black transition-all group cursor-pointer">
                    <span class="text-xs uppercase tracking-widest font-bold">3D Extrusion</span>
                    <span id="statusDepth" class="text-[10px] bg-blue-600 text-white px-2 py-0.5 font-bold group-hover:bg-black group-hover:text-white transition-colors">ON</span>
                </button>
                <button id="btnToggleRotate" class="w-full border border-neutral-800 py-3 px-4 flex justify-between items-center hover:bg-white hover:text-black transition-all group cursor-pointer">
                    <span class="text-xs uppercase tracking-widest font-bold">Auto-Orbit 360°</span>
                    <span id="statusRotate" class="text-[10px] bg-blue-600 text-white px-2 py-0.5 font-bold group-hover:bg-black group-hover:text-white transition-colors">ON</span>
                </button>
            </div>
        </div>

        <!-- SECCIÓN DE DESCARGA Y FORMATO -->
        <div class="mt-auto flex flex-col gap-4 border-t border-dashed border-neutral-800 pt-6">
            <div class="flex flex-col gap-2">
                <label for="formatSelect" class="text-[10px] text-neutral-500 uppercase tracking-widest">Export Canvas Format</label>
                <select id="formatSelect" class="bg-black border border-neutral-800 text-xs p-2.5 outline-none focus:border-white transition-colors uppercase tracking-wider text-neutral-300 cursor-pointer">
                    <option value="16:9">Wide (16:9)</option>
                    <option value="9:16">Mobile / Reel (9:16)</option>
                    <option value="1:1">Square (1:1)</option>
                </select>
            </div>

            <button id="downloadBtn" class="w-full bg-white text-black py-4 px-4 text-xs font-bold uppercase tracking-widest flex justify-between items-center hover:bg-blue-600 hover:text-white transition-colors cursor-pointer">
                <span>Export Video</span>
                <span class="font-pixel text-sm">↗</span>
            </button>
            
            <!-- CRÉDITOS -->
            <div class="mt-2 pt-4 flex flex-col items-center gap-1 text-[9px] text-neutral-600 uppercase tracking-widest border-t border-neutral-900 font-pixel">
                <div class="flex gap-3">
                    <a href="https://instagram.com/tarozzk" target="_blank" class="hover:text-blue-500 transition-colors">@tarozzk</a>
                    <span class="text-neutral-800">//</span>
                    <a href="https://instagram.com/desing.studi0" target="_blank" class="hover:text-blue-500 transition-colors">@desing.studi0</a>
                </div>
            </div>
        </div>
    </div>

    <video id="sourceVideo" loop muted style="display: none;"></video>
    <div id="canvas-container"></div>

    <script src="script.js"></script>
</body>
</html>
